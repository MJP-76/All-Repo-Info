name: Issue Review

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run issue review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
        run: python3 review_issues.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review_report.md
          if-no-files-found: ignore
