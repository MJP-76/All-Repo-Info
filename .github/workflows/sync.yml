name: Sync Repos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "repo_badges.json"
      - "sync_repos.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone all repos
        run: |
          mkdir -p ../repos
          cd ../repos
          # Read repo list from JSON config (no API token needed)
          python3 -c "
          import json
          data = json.load(open('../All-Repo-Info/repo_badges.json'))
          for name in data['repos']:
              print(name)
          " | while read repo; do
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/MJP-76/${repo}.git" 2>/dev/null && echo "CLONED: $repo" || echo "SKIP: $repo"
          done

      - name: Run sync
        run: python3 sync_repos.py --apply --update-table --repos-dir ../repos

      - name: Push changes to all repos
        run: |
          cd ../repos
          for dir in */; do
            [ -d "$dir" ] || continue
            repo="${dir%/}"
            cd "$repo"
            if git diff --quiet; then
              echo "SKIP: $repo (no changes)"
            else
              git push origin main 2>/dev/null || git push origin master 2>/dev/null || echo "PUSH FAILED: $repo"
              echo "PUSHED: $repo"
            fi
            cd ..
          done
